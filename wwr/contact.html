<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Whitewater Rafting Co. for trip reservations, general inquiries, website feedback, location details, and team information.">
  <meta name="author" content="Mark Onyancha">
  <title>Contact Us - Whitewater Rafting Co.</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <div class="logo-group">
      <img src="images/z-wwr-blue.jpg" alt="Whitewater Rafting Company Logo">
      <span id="logo">Whitewater Rafting</span>
    </div>

    <nav>
      <ul class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-company">
      <h1>Whitewater Rafting Company</h1>
      <address class="company-details">
        <p>123 Main River Street<br>Nanyuki, Kenya</p>
        <p>+254712490805</p>
        <p>info@whitewater.com</p>
      </address>

      <div class="contact-split">
        <div class="map-box">
          <iframe title="Whitewater Rafting Company Location Map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0!2d-113.0!3d37.3!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2z!5e0!3m2!1sen!2sus!4v1700000000000" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen>
          </iframe>
        </div>

        <form class="contact-form" action="#" method="post">
          <div class="form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Placeholder" required>
          </div>

          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Placeholder" required>
          </div>

          <div class="form-row form-row-top">
            <span class="field-label">Message Purpose</span>
            <div class="radio-group">
              <div class="choice-item">
                <input type="radio" id="general-inquiry" name="purpose" value="General Inquiry" required>
                <label for="general-inquiry">General Inquiry</label>
              </div>
              <div class="choice-item">
                <input type="radio" id="reservation-question" name="purpose" value="Reservation Question">
                <label for="reservation-question">Reservation Question</label>
              </div>
              <div class="choice-item">
                <input type="radio" id="website-suggestion" name="purpose" value="Website Suggestion">
                <label for="website-suggestion">Website Suggestion</label>
              </div>
            </div>
          </div>

          <div class="form-row form-row-top">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
          </div>

          <div class="form-submit-area">
            <div class="choice-item">
              <input type="checkbox" id="newsletter" name="newsletter" value="yes">
              <label for="newsletter">Please subscribe me to the monthly newsletter</label>
            </div>

            <button type="submit" class="submit-button">Get in Touch!</button>
          </div>
        </form>
      </div>
    </section>

    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <div class="employee-grid">
        <figure>
          <img src="images/rafting59_600.jpg" alt="Alex Rivera, Lead River Guide">
          <figcaption>Alex Rivera - Lead River Guide</figcaption>
        </figure>
        <figure>
          <img src="images/rafting29_600.jpg" alt="Jordan Brooks, Trip Coordinator">
          <figcaption>Jordan Brooks - Trip Coordinator</figcaption>
        </figure>
        <figure>
          <img src="images/rafting42_600.jpg" alt="Samira Patel, Safety Director">
          <figcaption>Samira Patel - Safety Director</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Whitewater Rafting Co. | Mark Onyancha</p>
    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank">
        <img src="images/facebook.svg" alt="Facebook Icon">
      </a>
      <a href="https://linkedin.com" target="_blank">
        <img src="images/linkedin.svg" alt="LinkedIn Icon">
      </a>
      <a href="https://instagram.com" target="_blank">
        <img src="images/instagram.svg" alt="Instagram Icon">
      </a>
    </nav>
  </footer>
</body>

</html>
